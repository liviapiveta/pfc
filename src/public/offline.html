<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFPlenus — Sem conexão</title>
  <meta name="theme-color" content="#1b1b1f" />
  <link rel="icon" type="image/png" href="/images/if-logo.png" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: #1b1b1f; color: #f4f5f7; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
    p { color: #c2c6cf; line-height: 1.6; margin: 0 0 1.5rem; }
    button { background: #44d883; color: #06281a; border: none; border-radius: 12px; padding: 0.85rem 1.6rem;
      font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/if-logo.png" alt="" />
    <h1>Você está sem internet</h1>
    <p>O IFPlenus precisa de conexão para buscar seus dados. Assim que a internet voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
