<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUAP Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <h1>SUAP<span>.</span>Portal</h1>
    <p>IFPR — Portal do Aluno</p>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar" id="userAvatar">?</div>
    <div class="user-name"   id="userName">Carregando…</div>
    <div class="user-mat"    id="userMat"></div>
  </div>
  <nav>
    <div class="nav-section">Acadêmico</div>
    <div class="nav-item active" data-section="dados">
      <span class="nav-icon">👤</span> Dados Pessoais
    </div>
    <div class="nav-item" data-section="boletim">
      <span class="nav-icon">📊</span> Boletim
    </div>
    <div class="nav-section">Atividades</div>
    <div class="nav-item" data-section="pesquisa">
      <span class="nav-icon">🔬</span> Projetos de Pesquisa
    </div>
    <div class="nav-item" data-section="extensao">
      <span class="nav-icon">🌱</span> Projetos de Extensão
    </div>
    <div class="nav-section">Institucional</div>
    <div class="nav-item" data-section="calendario">
      <span class="nav-icon">📅</span> Calendário
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">↩ Sair</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <span class="topbar-title" id="topbarTitle">Dados Pessoais</span>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="content">

    <section class="section active" id="section-dados">
      <div id="dadosContent">
        <div class="loading"><div class="spinner"></div> Buscando dados…</div>
      </div>
    </section>

    <section class="section" id="section-boletim">
      <div class="stats-row" id="boletimStats"></div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Disciplinas</span>
        </div>
        <div id="boletimContent">
          <div class="loading"><div class="spinner"></div> Carregando boletim…</div>
        </div>
      </div>
    </section>

    <section class="section" id="section-pesquisa">
      <div id="pesquisaContent">
        <div class="loading"><div class="spinner"></div> Buscando projetos…</div>
      </div>
    </section>

    <section class="section" id="section-extensao">
      <div id="extensaoContent">
        <div class="loading"><div class="spinner"></div> Buscando projetos…</div>
      </div>
    </section>

    <section class="section" id="section-calendario">
      <div id="calendarioContent">
        <div class="loading"><div class="spinner"></div> Carregando calendário…</div>
      </div>
    </section>

  </div>
</main>

<script src="/portal.js"></script>
</body>
</html>
