<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFPlenus — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #44d883;
      --verde-escuro: #36c172;
      --verde-glow: rgba(68,216,131,0.35);
      --bg: #1b1b1f;
      --card: #26262b;
      --texto: #f4f5f7;
      --texto-2: #c2c6cf;
      --cinza: #8b909b;
      --borda: rgba(255,255,255,0.1);
      --input-bg: #1f1f24;
      --erro: #ff6b6b;
      --amarelo: #f5b942;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--texto);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .login-wrap { width: 100%; max-width: 440px; padding: 2rem; }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 0.6rem;
    }
    .logo span { color: var(--verde); }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(245,185,66,0.12);
      border: 1px solid rgba(245,185,66,0.45);
      color: var(--amarelo);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 99px;
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-box {
      background: var(--card);
      border-radius: 18px;
      border: 1px solid var(--borda);
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--texto);
      margin-bottom: 0.3rem;
    }
    .login-sub { color: var(--cinza); font-size: 0.85rem; margin-bottom: 1.8rem; }

    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block; font-size: 0.8rem; font-weight: 500;
      color: var(--texto-2); margin-bottom: 0.35rem; letter-spacing: 0.3px;
    }
    .field input {
      width: 100%;
      border: 1.5px solid var(--borda);
      border-radius: 10px;
      padding: 0.72rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem;
      color: var(--texto);
      background: var(--input-bg);
      outline: none;
      transition: border-color 0.2s;
    }
    .field input::placeholder { color: var(--cinza); }
    .field input:focus { border-color: var(--amarelo); }

    .btn-login {
      width: 100%;
      background: var(--verde);
      color: #06281a;
      border: none;
      border-radius: 10px;
      padding: 0.82rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.97rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.4rem;
      letter-spacing: 0.2px;
    }
    .btn-login:hover { background: var(--verde-escuro); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .erro-msg {
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.4);
      color: var(--erro);
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.83rem;
      margin-top: 0.9rem;
      display: none;
    }

    .back-link {
      display: block; text-align: center; margin-top: 1.4rem;
      color: var(--cinza); font-size: 0.8rem; text-decoration: none;
    }
    .back-link:hover { color: var(--verde); }


    .info-msg {
      background: rgba(68,216,131,0.1);
      border: 1px solid rgba(68,216,131,0.4);
      color: #bff3d4;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      font-size: 0.85rem;
      line-height: 1.55;
    }
    .info-msg strong { color: #fff; }
    .email-fixo {
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
      background: var(--input-bg); border: 1.5px solid var(--borda); border-radius: 10px;
      padding: 0.62rem 0.9rem; font-size: 0.88rem; color: var(--texto-2); margin-bottom: 1.1rem;
      word-break: break-all;
    }
    .link-btn {
      background: none; border: none; color: var(--verde); font-family: inherit;
      font-size: 0.8rem; cursor: pointer; padding: 0; white-space: nowrap;
    }
    .link-btn:hover { text-decoration: underline; }
    .link-btn:disabled { color: var(--cinza); cursor: default; text-decoration: none; }
    .acoes-extra { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
    .etapa { display: none; }
    .etapa.ativa { display: block; }

    @media (max-width: 480px) { .login-wrap { padding: 1rem; } }

    /* Ícones (Lucide) — herdam tamanho (1em) e cor (currentColor) do contexto */
    svg.lucide { width:1em; height:1em; display:inline-block; vertical-align:-0.125em; flex-shrink:0; stroke-width:2; }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="logo">
    <img src="/images/if-logo.png" width="30" height="30" alt="Instituto Federal" style="object-fit:contain;display:block" />
    <span>IF<span style="color:var(--verde)">Plenus</span></span>
  </div>
  <div class="admin-badge"><i data-lucide="lock"></i> Área Administrativa</div>

  <div class="login-box">
    <h1 class="login-title">Acesso restrito</h1>
    <p class="login-sub" id="loginSub">Exclusivo para docentes e substitutos do IFPR</p>

    <!-- Etapa 1: e-mail -->
    <div class="etapa ativa" id="etapaEmail">
      <div class="field">
        <label for="email">E-mail institucional</label>
        <input type="email" id="email" placeholder="seuemail@ifpr.edu.br" autocomplete="username" />
      </div>
      <button class="btn-login" id="btnContinuar">Continuar</button>
    </div>

    <!-- Etapa 2: senha -->
    <div class="etapa" id="etapaSenha">
      <div class="email-fixo">
        <span id="emailMostrado"></span>
        <button class="link-btn" type="button" data-trocar>Trocar</button>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-login" id="btnLogin">Entrar no painel</button>
      <div class="acoes-extra">
        <button class="link-btn" type="button" id="btnEsqueci">Esqueci minha senha</button>
      </div>
    </div>

    <!-- Etapa 3: e-mail enviado -->
    <div class="etapa" id="etapaEnviado">
      <div class="info-msg" id="msgEnviado"></div>
      <div class="acoes-extra">
        <button class="link-btn" type="button" data-trocar>Usar outro e-mail</button>
        <button class="link-btn" type="button" id="btnReenviar">Reenviar e-mail</button>
      </div>
    </div>

    <div class="erro-msg" id="erroMsg"></div>
  </div>

  <a class="back-link" href="/"><i data-lucide="arrow-left"></i> Voltar ao portal do aluno</a>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const erroMsg = $('erroMsg');
  let emailAtual = '';
  let etapa = 'email';

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  function irPara(nova) {
    etapa = nova;
    document.querySelectorAll('.etapa').forEach((el) => el.classList.remove('ativa'));
    const mapa = { email: 'etapaEmail', senha: 'etapaSenha', enviado: 'etapaEnviado' };
    $(mapa[nova]).classList.add('ativa');
    esconderErro();
    if (nova === 'email') { $('loginSub').textContent = 'Exclusivo para docentes e substitutos do IFPR'; $('email').focus(); }
    if (nova === 'senha') { $('emailMostrado').textContent = emailAtual; $('senha').value = ''; $('senha').focus(); }
  }

  function mostrarErro(msg) { erroMsg.textContent = msg; erroMsg.style.display = 'block'; }
  function esconderErro() { erroMsg.style.display = 'none'; }

  async function post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  }

  async function carregando(btn, texto, fn) {
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = texto;
    try { await fn(); }
    catch (e) { mostrarErro('Erro de conexão. Verifique sua internet.'); }
    finally { btn.disabled = false; btn.textContent = original; }
  }

  function mostrarEnviado(titulo, texto) {
    $('loginSub').textContent = titulo;
    $('msgEnviado').innerHTML = texto;
    irPara('enviado');
  }

  // Etapa 1 → verifica se o e-mail está autorizado
  async function continuar() {
    const email = $('email').value.trim().toLowerCase();
    if (!email) { mostrarErro('Informe seu e-mail institucional.'); return; }
    esconderErro();

    await carregando($('btnContinuar'), 'Verificando…', async () => {
      const { ok, data } = await post('/api/admin/login/email', { email });
      if (!ok) { mostrarErro(data.erro || 'Não foi possível verificar o e-mail.'); return; }
      emailAtual = email;
      if (data.etapa === 'senha') irPara('senha');
      else mostrarEnviado('Verifique seu e-mail',
        `É seu primeiro acesso! Enviamos um link <strong>"Cadastrar sua senha"</strong> para <strong>${esc(email)}</strong>.<br><br>
         Abra o e-mail (confira também o spam), cadastre sua senha e você já entra no painel. O link vale por 48 horas.`);
    });
  }

  // Etapa 2 → login com senha
  async function entrar() {
    const senha = $('senha').value;
    if (!senha) { mostrarErro('Digite sua senha.'); return; }
    esconderErro();

    await carregando($('btnLogin'), 'Entrando…', async () => {
      const { ok, data } = await post('/api/admin/login', { email: emailAtual, senha });
      if (ok && data.sucesso) window.location.href = '/admin';
      else mostrarErro(data.erro || 'E-mail ou senha incorretos.');
    });
  }

  async function esqueci() {
    await carregando($('btnEsqueci'), 'Enviando…', async () => {
      await post('/api/admin/senha/esqueci', { email: emailAtual });
      mostrarEnviado('Verifique seu e-mail',
        `Enviamos um link para <strong>redefinir sua senha</strong> para <strong>${esc(emailAtual)}</strong>.<br><br>
         Confira também a caixa de spam. O link vale por 48 horas.`);
    });
  }

  async function reenviar() {
    const btn = $('btnReenviar');
    await carregando(btn, 'Enviando…', async () => {
      await post('/api/admin/senha/esqueci', { email: emailAtual });
    });
    btn.disabled = true; btn.textContent = 'E-mail reenviado ✓';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Reenviar e-mail'; }, 60000);
  }

  $('btnContinuar').addEventListener('click', continuar);
  $('btnLogin').addEventListener('click', entrar);
  $('btnEsqueci').addEventListener('click', esqueci);
  $('btnReenviar').addEventListener('click', reenviar);
  document.querySelectorAll('[data-trocar]').forEach((b) => b.addEventListener('click', () => irPara('email')));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (etapa === 'email') continuar();
    else if (etapa === 'senha') entrar();
  });
</script>
<!-- Ícones (Lucide) -->
<script src="https://unpkg.com/lucide@0.330.0/dist/umd/lucide.min.js"></script>
<script>
  (function () {
    let agendado = false;
    const desenhar = () => {
      if (!window.lucide || agendado) return;
      agendado = true;
      requestAnimationFrame(() => { agendado = false; window.lucide.createIcons(); });
    };
    const iniciar = () => {
      desenhar();
      new MutationObserver(desenhar).observe(document.body, { childList: true, subtree: true });
    };
    // Espera o script do CDN carregar (defensivo: funciona mesmo se o
    // <script> do Lucide ainda não tiver executado quando este rodar).
    if (window.lucide) iniciar();
    else {
      const t = setInterval(() => { if (window.lucide) { clearInterval(t); iniciar(); } }, 50);
      setTimeout(() => clearInterval(t), 8000);
    }
  })();
</script>
</body>
</html>
