<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUAP Portal — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #00c27a;
      --verde-escuro: #00956a;
      --azul: #003566;
      --bg: #f5f7fa;
      --texto: #0d1b2a;
      --cinza: #6b7a8d;
      --erro: #e53e3e;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Lado esquerdo — visual */
    .visual {
      background: var(--azul);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem;
      position: relative;
      overflow: hidden;
    }

    .visual::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,194,122,0.25) 0%, transparent 70%);
      top: -100px;
      right: -100px;
    }

    .visual::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0,194,122,0.15) 0%, transparent 70%);
      bottom: -50px;
      left: 50px;
    }

    .visual-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2.5rem;
      color: white;
      letter-spacing: -1px;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .visual-logo span { color: var(--verde); }

    .visual-tagline {
      color: rgba(255,255,255,0.65);
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.7;
      max-width: 340px;
      position: relative;
      z-index: 1;
    }

    .visual-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 2.5rem;
      position: relative;
      z-index: 1;
    }

    .badge {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      font-size: 0.78rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-weight: 500;
    }

    /* Lado direito — formulário */
    .login-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      color: var(--texto);
      margin-bottom: 0.4rem;
    }

    .login-sub {
      color: var(--cinza);
      font-size: 0.9rem;
      margin-bottom: 2.2rem;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--texto);
      margin-bottom: 0.4rem;
      letter-spacing: 0.3px;
    }

    .field input {
      width: 100%;
      border: 1.5px solid #dde2e9;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--texto);
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--verde);
    }

    .btn-login {
      width: 100%;
      background: var(--verde);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn-login:hover { background: var(--verde-escuro); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .erro-msg {
      background: #fff5f5;
      border: 1px solid #fed7d7;
      color: var(--erro);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }

    .ifpr-note {
      color: var(--cinza);
      font-size: 0.78rem;
      text-align: center;
      margin-top: 1.8rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .visual { display: none; }
    }
  </style>
</head>
<body>

<div class="visual">
  <div class="visual-logo">SUAP<span>.</span>Portal</div>
  <p class="visual-tagline">Acesse suas informações acadêmicas do IFPR em um só lugar.</p>
  <div class="visual-badges">
    <span class="badge">📊 Boletim</span>
    <span class="badge">👤 Dados Pessoais</span>
    <span class="badge">🔬 Pesquisa</span>
    <span class="badge">🌱 Extensão</span>
    <span class="badge">📅 Calendário</span>
  </div>
</div>

<div class="login-side">
  <div class="login-box">
    <h1 class="login-title">Entrar</h1>
    <p class="login-sub">Use suas credenciais do SUAP IFPR</p>

    <div class="field">
      <label for="matricula">Matrícula</label>
      <input type="text" id="matricula" placeholder="Ex: 2023001234" autocomplete="username" />
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Sua senha do SUAP" autocomplete="current-password" />
    </div>

    <button class="btn-login" id="btnLogin">Entrar no Portal</button>

    <div class="erro-msg" id="erroMsg"></div>

    <p class="ifpr-note">
      Utilize as mesmas credenciais que você usa<br>para acessar o SUAP IFPR.
    </p>
  </div>
</div>

<script>
  const btn = document.getElementById('btnLogin');
  const erroMsg = document.getElementById('erroMsg');

  async function fazerLogin() {
    const matricula = document.getElementById('matricula').value.trim();
    const senha = document.getElementById('senha').value;

    if (!matricula || !senha) {
      mostrarErro('Preencha matrícula e senha.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Autenticando…';
    erroMsg.style.display = 'none';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ matricula, senha }),
      });
      const data = await res.json();

      if (res.ok && data.sucesso) {
        window.location.href = '/';
      } else {
        mostrarErro(data.erro || 'Erro ao autenticar.');
      }
    } catch (e) {
      mostrarErro('Erro de conexão. Verifique sua internet.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar no Portal';
    }
  }

  function mostrarErro(msg) {
    erroMsg.textContent = msg;
    erroMsg.style.display = 'block';
  }

  btn.addEventListener('click', fazerLogin);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fazerLogin();
  });
</script>
</body>
</html>
